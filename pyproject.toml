[project]
name = "prosoel-costes"
version = "0.1.0"
description = "Motor de costes y base historica de pedidos de PROSOEL"
requires-python = ">=3.12"
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
