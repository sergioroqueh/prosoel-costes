name: Research official material references

on:
  push:
    branches: [main]
    paths:
      - "scripts/research_manufacturers.py"
      - "tests/test_research_manufacturers.py"
      - ".github/workflows/material-research.yml"
  schedule:
    # Weekly Monday 05:17 UTC (GitHub may delay).
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without saving candidate evidence"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: material-research
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python tests, no secrets and no network
        run: python3 -m unittest discover -s tests -p "test_research_manufacturers.py" -v
      - name: Check outbound connectivity (diagnostic only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, socket, urllib.request
          print("HTTPS_PROXY configured:", bool(os.getenv("HTTPS_PROXY") or os.getenv("https_proxy")))
          for host in ("example.com", "www.aiscan.com", "www.legrand.es"):
              try:
                  ips=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  print(host,"IPv4",sum(x[0]==socket.AF_INET for x in ips),
                        "IPv6",sum(x[0]==socket.AF_INET6 for x in ips))
              except Exception as exc:
                  print(host,"DNS failure:",type(exc).__name__,str(exc)[:140])
          for url in ("https://example.com/",
                      "https://www.aiscan.com/producto/cr/tubo-aiscan-cr-cr20/"):
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req,timeout=7) as response:
                      print(url,"HTTP",response.status,
                            "content-type",response.headers.get("content-type",""))
              except Exception as exc:
                  print(url,"Download failure:",type(exc).__name__,str(exc)[:160])
          PY

  researcher:
    needs: tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://kusbndefngttaiytcrui.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check research credentials
        id: config
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Research not active: add SUPABASE_SERVICE_ROLE_KEY under GitHub Actions secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Research official sources (maximum 12 products)
        if: steps.config.outputs.ready == 'true'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/research_manufacturers.py --limit 12 --scan 130 --dry-run
          else
            python3 scripts/research_manufacturers.py --limit 12 --scan 130
          fi
