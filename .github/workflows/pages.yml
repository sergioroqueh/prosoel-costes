name: Deploy PROSOEL Costes to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/static

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # La subida del artefacto puede tardar unos segundos en ser visible
      # para la API de GitHub Pages; separar jobs evita el fallo "Found 0".
      - name: Wait for artifact indexing
        run: sleep 12

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
