name: Deploy PROSOEL Costes to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/static/**"
      - "scripts/build_rebt_reader.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify LGA calculator
        run: node --test tests/lga_20261117.test.mjs

      - name: Generar lector REBT desde la API oficial del BOE
        run: python3 scripts/build_rebt_reader.py

      - name: Verificar integridad de la copia oficial
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('app/static/rebt_legal_text.json').read_text(encoding='utf-8'))
          assert data['source']=='BOE-A-2002-18099'
          assert data['readableBlocks']==81 and data['characters']>100_000
          print('BOE consolidado: 81 bloques y', data['characters'], 'caracteres.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/static

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # La subida del artefacto puede tardar unos segundos en ser visible
      # para la API de GitHub Pages; separar jobs evita el fallo "Found 0".
      - name: Wait for artifact indexing
        run: sleep 12

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
