name: Aprende REBT (sin desplegar)
on:
  pull_request:
  push:
    branches:
      - feat/aprende-rebt-sergio-20261117
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/rebt_20261117.test.mjs tests/lga_20261117.test.mjs
