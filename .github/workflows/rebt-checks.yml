name: Aprende REBT (sin desplegar)
on:
  pull_request:
  push:
    branches:
      - feat/aprende-rebt-sergio-20261117
      - feat/rebt-catalogo-ux-r4-20261117
      - feat/rebt-lectura-normativa-r5-20261117
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/rebt_20261117.test.mjs tests/lga_20261117.test.mjs
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/rebt_browser_20261117.mjs
      - run: node tests/rebt_browser_normativa_20261117.mjs
      - name: Guardar capturas de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebt-r5-browser-screenshots
          path: |
            tests/rebt-screenshots/*.png
            tests/rebt-normas-screenshots/*.png
          if-no-files-found: ignore
